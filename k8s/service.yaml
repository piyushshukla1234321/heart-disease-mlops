# LoadBalancer: Docker Desktop maps it to localhost:8080.
# Minikube: run `minikube tunnel` in a separate terminal to get an external IP.
apiVersion: v1
kind: Service
metadata:
  name: heart-risk-api
  namespace: heart-risk
  labels:
    app: heart-risk-api
spec:
  type: LoadBalancer
  selector:
    app: heart-risk-api
  ports:
    - name: http
      port: 8080
      targetPort: http
