apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-risk-api
  namespace: heart-risk
  labels:
    app: heart-risk-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # never drop below 2 ready pods during an update
      maxSurge: 1
  selector:
    matchLabels:
      app: heart-risk-api
  template:
    metadata:
      labels:
        app: heart-risk-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: heart-risk-api:1.0.0
          imagePullPolicy: IfNotPresent   # use the locally built image
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: MODEL_PATH
              value: /app/models/model.joblib
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:            # only route traffic once the model is loaded
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:             # restart the container if the process hangs
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
